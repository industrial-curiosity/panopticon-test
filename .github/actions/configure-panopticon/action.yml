name: Configure Panopticon provider
description: Validate and persist one trusted Panopticon provider contract

inputs:
  provider:
    description: Trusted provider identifier fixed by the calling workflow
    required: true
  credential-mode:
    description: Bedrock credential mode; empty for LiteLLM or OpenAI
    required: false
    default: ""
  instance-token-name:
    description: Organization secret name for the instance checkout token
    required: true
  api-key-name:
    description: LiteLLM or OpenAI organization secret name; empty for Bedrock
    required: false
    default: ""
  model-variable-name:
    description: Organization variable name for the provider model
    required: true
  model-default:
    description: Optional non-secret model identifier value used when the organization variable is empty; Bedrock only
    required: false
    default: ""
  endpoint-variable-name:
    description: LiteLLM endpoint variable name; empty for OpenAI or Bedrock
    required: false
    default: ""
  aws-region-variable-name:
    description: Bedrock GitHub-OIDC region variable name; empty otherwise
    required: false
    default: ""
  aws-role-arn-variable-name:
    description: Bedrock GitHub-OIDC role ARN variable name; empty otherwise
    required: false
    default: ""
  timeout-seconds-variable-name:
    description: Organization variable name for the per-request timeout
    required: true
  max-attempts-variable-name:
    description: Organization variable name for transport attempts
    required: true
  max-correction-attempts-variable-name:
    description: Organization variable name for structured-response correction attempts
    required: true
  job-timeout-minutes-variable-name:
    description: Organization variable name for the PR-evaluation job timeout
    required: true
  timeout-seconds-default:
    description: Optional non-secret request-timeout default value
    required: false
    default: ""
  max-attempts-default:
    description: Optional non-secret transport-attempt default value
    required: false
    default: ""
  max-correction-attempts-default:
    description: Optional non-secret correction-attempt default value
    required: false
    default: ""
  target-branch:
    description: Instance branch that receives the validated configuration commit
    required: true

runs:
  using: composite
  steps:
    - name: Validate and persist provider names
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
        PROVIDER: ${{ inputs.provider }}
        CREDENTIAL_MODE: ${{ inputs.credential-mode }}
        INSTANCE_TOKEN_NAME: ${{ inputs.instance-token-name }}
        API_KEY_NAME: ${{ inputs.api-key-name }}
        MODEL_VARIABLE_NAME: ${{ inputs.model-variable-name }}
        MODEL_DEFAULT: ${{ inputs.model-default }}
        ENDPOINT_VARIABLE_NAME: ${{ inputs.endpoint-variable-name }}
        AWS_REGION_VARIABLE_NAME: ${{ inputs.aws-region-variable-name }}
        AWS_ROLE_ARN_VARIABLE_NAME: ${{ inputs.aws-role-arn-variable-name }}
        TIMEOUT_SECONDS_VARIABLE_NAME: ${{ inputs.timeout-seconds-variable-name }}
        MAX_ATTEMPTS_VARIABLE_NAME: ${{ inputs.max-attempts-variable-name }}
        MAX_CORRECTION_ATTEMPTS_VARIABLE_NAME: ${{ inputs.max-correction-attempts-variable-name }}
        JOB_TIMEOUT_MINUTES_VARIABLE_NAME: ${{ inputs.job-timeout-minutes-variable-name }}
        TIMEOUT_SECONDS_DEFAULT: ${{ inputs.timeout-seconds-default }}
        MAX_ATTEMPTS_DEFAULT: ${{ inputs.max-attempts-default }}
        MAX_CORRECTION_ATTEMPTS_DEFAULT: ${{ inputs.max-correction-attempts-default }}
      run: |
        import json
        import os

        from panopticon.configure_instance import configure
        from panopticon.providers import ProviderConfigError, resolve_provider_contract

        def fail(reason):
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                summary.write("## Panopticon gate 2 failed: effective provider configuration\n\n")
                summary.write(f"- Provider: `{os.environ['PROVIDER']}`\n")
                summary.write("- Expected resource: `panopticon.config.json` and the selected provider's configured names\n")
                summary.write("- Scope: the provider contract is instance-wide; generated caller revisions are per child.\n")
                summary.write(f"- Evidence: {reason}\n\n")
                summary.write("Fix location: correct the workflow-dispatch inputs in this instance configuration workflow, then rerun it.\n")
            print(f"::error::{reason}; see the step summary")
            raise SystemExit(1)

        name_environment = {
            "instance_token": "INSTANCE_TOKEN_NAME",
            "api_key": "API_KEY_NAME",
            "model": "MODEL_VARIABLE_NAME",
            "endpoint": "ENDPOINT_VARIABLE_NAME",
            "aws_region": "AWS_REGION_VARIABLE_NAME",
            "aws_role_arn": "AWS_ROLE_ARN_VARIABLE_NAME",
            "timeout_seconds": "TIMEOUT_SECONDS_VARIABLE_NAME",
            "max_attempts": "MAX_ATTEMPTS_VARIABLE_NAME",
            "max_correction_attempts": "MAX_CORRECTION_ATTEMPTS_VARIABLE_NAME",
            "job_timeout_minutes": "JOB_TIMEOUT_MINUTES_VARIABLE_NAME",
        }
        names = {
            logical: os.environ[environment_name]
            for logical, environment_name in name_environment.items()
            if os.environ[environment_name]
        }
        defaults = {
            logical: os.environ[environment_name]
            for logical, environment_name in {
                "model": "MODEL_DEFAULT",
                "timeout_seconds": "TIMEOUT_SECONDS_DEFAULT",
                "max_attempts": "MAX_ATTEMPTS_DEFAULT",
                "max_correction_attempts": "MAX_CORRECTION_ATTEMPTS_DEFAULT",
            }.items()
            if os.environ[environment_name].strip()
        }

        try:
            configured = configure(
                ".",
                os.environ["PROVIDER"],
                names,
                os.environ["CREDENTIAL_MODE"] or None,
                defaults,
            )
            contract = resolve_provider_contract(configured)
        except (ProviderConfigError, json.JSONDecodeError) as exc:
            fail(f"Panopticon provider configuration is invalid: {exc}")
        except Exception as exc:
            fail(f"Unexpected provider configuration failure: {exc}")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## Panopticon gate 2 passed: effective provider configuration\n\n")
            summary.write(f"## Panopticon provider: `{configured['provider']}`\n\n")
            summary.write("Configure these required organization-level Actions names with values:\n\n")
            for logical, name in configured["secrets"].items():
                summary.write(f"- Secret `{name}` ({logical})\n")
            for logical, name in configured["variables"].items():
                if logical in contract["optional_variables"]:
                    continue
                summary.write(f"- Variable `{name}` ({logical})\n")
            budget_variables = [
                logical
                for logical in contract["optional_variables"]
                if logical not in {"model", "job_timeout_minutes"}
            ]
            summary.write("\nOptional request-budget variables may be set as organization overrides:\n\n")
            for logical in budget_variables:
                summary.write(f"- Variable `{configured['variables'][logical]}` ({logical})\n")
            summary.write(
                "\nLeave an optional request-budget variable empty to use the fixed instance "
                "Action, an instance-configured default, or the workflow default. Job timeout "
                "uses only the organization variable or the reusable-workflow fallback because "
                "GitHub resolves it before this job starts.\n"
            )
            if "model" in contract["optional_variables"]:
                summary.write(
                    "\nBedrock model is optional for organization prerequisite checks. Set the "
                    f"organization variable `{configured['variables']['model']}` or provide the "
                    "non-secret `llm.defaults.model` instance default; the organization variable "
                    "takes precedence.\n"
                )
            summary.write("No credential values were accepted or persisted by this workflow.\n")

    - name: Commit instance configuration
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: |
        set -euo pipefail

        fail() {
          local reason=${1:?failure reason}
          {
            echo
            echo "## Panopticon gate 2 failed: effective provider configuration"
            echo
            echo "- Provider: ${PROVIDER}"
            echo "- Expected resource: panopticon.config.json and the selected provider's configured names"
            echo "- Scope: the provider contract is instance-wide; generated caller revisions are per child."
            echo "- Evidence: ${reason}"
            echo
            echo "Fix location: correct the reported problem in this instance configuration workflow, then rerun it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::${reason}; see the step summary"
          exit 1
        }

        if [ -z "${TARGET_BRANCH//[[:space:]]/}" ]; then
          fail "The target instance branch is empty."
        fi
        if git diff --quiet -- panopticon.config.json; then
          echo "Configuration already matches the requested ${PROVIDER} contract." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git config user.name "github-actions[bot]" ||
          fail "Git could not set the configuration commit user name."
        git config user.email "github-actions[bot]@users.noreply.github.com" ||
          fail "Git could not set the configuration commit user email."
        git add panopticon.config.json ||
          fail "Git could not stage panopticon.config.json."
        git commit -m "chore: configure Panopticon ${PROVIDER} provider" ||
          fail "Git could not commit the validated ${PROVIDER} configuration."
        if ! git push origin "HEAD:${TARGET_BRANCH}"; then
          {
            echo
            echo "## Panopticon gate 2 failed: effective provider configuration"
            echo
            echo "- Provider: ${PROVIDER}"
            echo "- Expected resource: the validated panopticon.config.json commit on ${TARGET_BRANCH}"
            echo "- Scope: instance-wide configuration publication"
            echo "- Evidence: validation succeeded, but the instance branch did not accept the push."
            echo
            echo "Fix location: apply the validated diff on a local branch, open a PR, and merge it; then rerun or await child bootstrap."
            echo
            echo "Branch protection may require a pull request. Apply this validated diff on a"
            echo "local branch, open a PR, and merge it:"
            echo
            echo '```diff'
            git show --format= -- panopticon.config.json
            echo '```'
            echo "Panopticon is not configured until that commit reaches ${TARGET_BRANCH}."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The validated ${PROVIDER} configuration could not be pushed; see the step summary"
          exit 1
        fi
