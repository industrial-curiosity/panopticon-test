name: Panopticon AWS credentials (instance-managed example)
description: >-
  Public, credential-free skeleton for the fixed instance-managed Bedrock action.
  Replace only the organization broker step.

outputs:
  aws_region:
    description: AWS region selected by the organization broker
    value: ${{ steps.validate-region.outputs.aws_region }}

runs:
  using: composite
  steps:
    - id: organization-broker
      name: Replace with the organization credential broker
      shell: bash
      run: |
        set -euo pipefail
        # Replace this step with the approved organization broker. It must configure
        # the caller identity without accepting a credential value from Panopticon,
        # then write the selected region to both destinations below:
        #   echo "PANOPTICON_AWS_REGION=YOUR_AWS_REGION" >> "$GITHUB_ENV"
        #   echo "aws_region=YOUR_AWS_REGION" >> "$GITHUB_OUTPUT"
        echo "::error::Replace the organization-broker placeholder with the approved broker"
        exit 1

    - id: validate-region
      name: Validate the broker region output
      shell: bash
      run: |
        set -euo pipefail
        region="${PANOPTICON_AWS_REGION:-}"
        if [[ -z "${region//[[:space:]]/}" ]]; then
          echo "::error::The organization broker must write PANOPTICON_AWS_REGION to GITHUB_ENV"
          exit 1
        fi
        echo "aws_region=$region" >> "$GITHUB_OUTPUT"
